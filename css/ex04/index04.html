<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - The Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Box Model Comparison</h2>

    <div class="comparison-container">
        
        <div class="box content-box">
            <h3>Content-Box</h3>
            <p>Width: 200px + Padding + Border = 260px Total Width</p>
        </div>

        
        <div class="box border-box">
            <h3>Border-Box</h3>
            <p>Width: 200px (Absorbs Padding & Border inside)</p>
        </div>
    </div>

</body>
</html>
